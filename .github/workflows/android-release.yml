name: Build Vibely Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore vibely-release.keystore \
            -storepass vibely-release \
            -keypass vibely-release \
            -alias vibely \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Vibely, OU=Mobile, O=Vibely, L=Dhaka, S=Dhaka, C=BD"

      - name: Restore and publish APK
        run: |
          dotnet restore InstagramClone.Mobile/InstagramClone.Mobile.csproj \
            -p:TargetFramework=net10.0-android \
            -p:RuntimeIdentifier=android-arm64
          dotnet publish InstagramClone.Mobile/InstagramClone.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/vibely-release.keystore" \
            -p:AndroidSigningKeyAlias=vibely \
            -p:AndroidSigningStorePass=vibely-release \
            -p:AndroidSigningKeyPass=vibely-release \
            -o "$GITHUB_WORKSPACE/out"

      - name: Rename APK
        run: mv out/com.vibely.social-Signed.apk out/Vibely-1.0.5-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-1.0.5-android
          path: out/Vibely-1.0.5-android.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Vibely-1.0.5-android.apk
          generate_release_notes: true
